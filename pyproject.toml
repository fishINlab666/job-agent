# 安装项目本身，而不只是依赖；入口命令和 MCP 模块必须能从仓库外启动。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[project]
name = "job-agent"
version = "0.2.0"
description = "校招 Agent —— 发现、筛选、代投、跟踪"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
# 只有跑 MCP server 才要。不进主依赖：它会带进 20 个包（starlette / uvicorn /
# cryptography / httpx2），而 CLI 一个都用不上。
# 装：uv pip install -e ".[mcp]"
mcp = [
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # tests/test_mcp_server.py 要真的起 server 才能查注册表和跑哨兵，
    # 所以测试环境里必须有它。不装的话整个文件会 import 失败而不是跳过 ——
    # 故意的：守卫测试静默消失比测试报错危险得多。
    # （这里原先写着「那 32 条」，写下时是对的，之后涨到 56 条没人改。
    #   注释里的当前数就是这么烂的，所以现在不写数。）
    "mcp>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
jobagent = "jobagent.cli:app"
