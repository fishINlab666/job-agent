name: Cloud Collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobagent-cloud-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out collection code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.29
          python-version: "3.13"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Collect five sources and publish complete snapshots
        env:
          JOBAGENT_CLOUD_URL: ${{ vars.JOBAGENT_CLOUD_URL }}
          JOBAGENT_INGEST_TOKEN: ${{ secrets.JOBAGENT_INGEST_TOKEN }}
          JOBAGENT_COLLECTION_MODE: technical-trial
        run: uv run --frozen python -m jobagent.remote_collect
